[platformio]
default_envs = heltec_v4

[env:heltec_v4]
platform = platformio/espressif32@6.11.0
framework = arduino
board = heltec_v4
board_build.variants_dir = variants
board_build.filesystem = littlefs
upload_port = COM11
; esptool 4.8+ can reset this board into download mode over native USB; 4.5.1 can't.
platform_packages = platformio/tool-esptoolpy@~1.40801.0
monitor_port = COM11
monitor_speed = 115200
lib_deps =
  olikraus/U8g2
  mikalhart/TinyGPSPlus
  h2zero/NimBLE-Arduino@^1.4

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_ldf_mode = deep+
test_build_src = no

[env:heltec_v4_demo]
extends = env:heltec_v4
build_flags = -DDEMO
board_build.embed_files = test/fixtures/small.bin
