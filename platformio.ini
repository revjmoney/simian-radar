[platformio]
default_envs = heltec_v4

[env:heltec_v4]
platform = platformio/espressif32@6.11.0
framework = arduino
board = heltec_v4
board_build.variants_dir = variants
board_build.filesystem = littlefs
upload_port = COM11
; esptool 4.9 resets this board into download mode over native USB, and only a watchdog reset
; boots the app afterwards (an RTS reset leaves it in the bootloader).
platform_packages = platformio/tool-esptoolpy@2.40900.250804
board_upload.after_reset = watchdog_reset
monitor_port = COM11
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
  olikraus/U8g2_for_Adafruit_GFX@^1.8.0
  mikalhart/TinyGPSPlus
  h2zero/NimBLE-Arduino@^1.4
  jgromes/RadioLib@^7.1.2

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_ldf_mode = deep+
test_build_src = no

